name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v0.2.2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.10
      - run: uv sync --locked
      - run: uv run python -m unittest -v test_connector test_install
      - name: Build distribution archives
        run: |
          uv build
          npm pack --pack-destination dist
          (cd plugins/netease-email/skills && zip -r ../../../dist/netease-email-skill.zip netease-email)
          (cd plugins && zip -r ../dist/netease-email-plugin.zip netease-email)
          uv run python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          for path in Path('dist').iterdir():
              if path.suffix in {'.whl', '.zip'}:
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
              elif path.name.endswith(('.tar.gz', '.tgz')):
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              else:
                  continue
              assert all(Path(n).name not in {'.env', '.live-test-state.json'} for n in names)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) exit 1 ;; esac
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG — NetEase Email Connector" --notes-file CHANGELOG.md
