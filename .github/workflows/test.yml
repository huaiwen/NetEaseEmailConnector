name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.10.10
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run python -m unittest -v test_connector test_install
      - run: uv build
      - name: Reject local secrets in source
        run: |
          test -z "$(git ls-files .env '.env.*' .live-test-state.json | sed '/^\.env\.example$/d')"
